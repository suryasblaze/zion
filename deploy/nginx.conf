# =====================================================================
# ZION Herbs -- nginx
#
#   /etc/nginx/sites-available/zion   ->  symlink into sites-enabled
#
# Everything is served from one origin: nginx hands out the built React
# files and proxies /api to gunicorn. That means no CORS at all in the
# browser, and it puts /sitemap.xml, /robots.txt and /llms.txt -- which
# Flask generates -- on the same domain as the shop, where crawlers
# expect them.
# =====================================================================

# ---------------------------------------------------------------------
# These two live in the http{} block, not here. Put them in
# /etc/nginx/conf.d/zion-limits.conf, or paste into nginx.conf:
#
#   limit_req_zone $binary_remote_addr zone=zion_api:10m   rate=30r/m;
#   limit_req_zone $binary_remote_addr zone=zion_auth:10m  rate=10r/m;
#   limit_req_zone $binary_remote_addr zone=zion_write:10m rate=6r/m;
#
# zion_auth guards sign-in and registration against credential stuffing.
# zion_write guards the event form: it leaks nothing, but without a limit
# someone can fill the table with sign-ups for numbers they do not own.
# ---------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name zionherbs.in www.zionherbs.in;

    # Certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zionherbs.in www.zionherbs.in;

    ssl_certificate     /etc/letsencrypt/live/zionherbs.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zionherbs.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/zion/dist;
    index index.html;

    # ---------------------------------------------------- security
    add_header X-Content-Type-Options  "nosniff"                   always;
    add_header X-Frame-Options         "SAMEORIGIN"                always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Razorpay's checkout script and Google Fonts are the only third
    # parties the pages load. Everything else is same-origin.
    add_header Content-Security-Policy "default-src 'self'; \
script-src 'self' https://checkout.razorpay.com; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
font-src 'self' https://fonts.gstatic.com; \
img-src 'self' data: https://*.supabase.co; \
connect-src 'self' https://*.supabase.co https://api.razorpay.com https://lumberjack.razorpay.com; \
frame-src https://api.razorpay.com https://checkout.razorpay.com; \
object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # ---------------------------------------------------- compression
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      application/rss+xml font/woff font/woff2;

    # If ngx_brotli is built in, this beats gzip on text by ~15%.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 10m;      # media uploads are capped at 8m in Flask

    # ---------------------------------------------------- the API
    location /api/ {
        limit_req zone=zion_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # An API response is never a static asset.
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # Sign-in and registration: tighter, because these are what gets
    # hammered. X-Forwarded-For is what the app hashes for fraud checks,
    # so the header above matters as much as the limit.
    location = /api/auth/login    { limit_req zone=zion_auth burst=5 nodelay; try_files /dev/null @api; }
    location = /api/auth/register { limit_req zone=zion_auth burst=5 nodelay; try_files /dev/null @api; }
    location = /api/events/signup { limit_req zone=zion_write burst=3 nodelay; try_files /dev/null @api; }

    location @api {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        add_header Cache-Control "no-store" always;
    }

    # ------------------------------------------ Flask-generated SEO
    # Served from the app so they reflect live products, not a build.
    location ~ ^/(sitemap\.xml|robots\.txt|llms\.txt)$ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires 1h;
    }

    # ---------------------------------------------------- static
    # Hashed filenames, so these can never go stale. A year is the max
    # the spec allows and immutable stops revalidation entirely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/(products|brand)/.*\.(jpg|jpeg|png|webp|avif|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---------------------------------------------------- the app
    # index.html must never be cached, or a deploy leaves people on the
    # old build pointing at asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The admin panel is not something to advertise to crawlers.
    location /admin { try_files $uri /index.html; add_header X-Robots-Tag "noindex, nofollow" always; }

    location ~ /\.(?!well-known) { deny all; }

    access_log /var/log/nginx/zion.access.log;
    error_log  /var/log/nginx/zion.error.log warn;
}
